name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-encoding:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: node node_modules/vitest/vitest.mjs run test/windows-encoding.test.mjs test/terminal-text.test.mjs
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run pages:build
      - run: node test/integration/portable_artifact.mjs node
      - run: node test/integration/portable_artifact.mjs workers
