name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: node node_modules/vitest/vitest.mjs run test/installer-session.test.mjs test/installer-resume.test.mjs test/installer-wizard.test.mjs test/installer-ui.test.mjs test/english-installer.test.mjs
      - run: npm run test:baseline-ui
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: bash -n install.sh
      - run: npm test
      - run: npm run pages:build
      - run: node test/integration/portable_artifact.mjs node
      - run: node test/integration/portable_artifact.mjs workers
      - run: npm run test:baseline-ui
      - uses: actions/upload-artifact@v4
        with:
          name: working-baseline-ui-local-tests
          include-hidden-files: true
          path: |
            .artifacts/working-baseline-ui/worker.mjs
            .artifacts/working-baseline-ui/manifest.json
            .artifacts/working-baseline-ui/migrations
            .artifacts/working-baseline-ui/LICENSE
            .artifacts/working-baseline-ui/THIRD_PARTY_NOTICES.md
